# Auf eine 3,8-GB-Maschine zugeschnitten. Flutters Vorgabe ist -Xmx8G, also mehr
# als doppelt so viel Heap wie physischer RAM. Die JVM räumt dann nicht auf,
# sondern wächst in den Swap. Das hat hier nicht nur gebremst, sondern unter
# Speicherdruck TLS-Downloads mit "bad_record_mac" zerlegt: Daten, die die
# TCP-Prüfung schon passiert hatten, wurden lokal im Speicher verfälscht —
# verstärkt durch komprimierten zram-Swap.
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Der größte Einzelposten: Kotlin startet sonst eine ZWEITE JVM neben Gradle.
# In-process spart deren kompletten Grundverbrauch (400-700 MB).
kotlin.compiler.execution.strategy=in-process

# Inkrementelle Kompilierung hält zusätzliche Zustände im Speicher. Bei einem
# Rechner, der ohnehin am Limit läuft, ist der Tausch die Sache wert.
kotlin.incremental=false

# Kein dauerhafter Daemon: so gibt der Build seinen Speicher hinterher wieder
# frei, statt ihn zwischen den Läufen zu halten.
org.gradle.daemon=false

# Ein Worker, kein paralleler Modulbau, kein File-Watching — sonst streiten
# sich die Tasks um den knappen Speicher und landen wieder im Swap.
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.vfs.watch=false

android.useAndroidX=true
